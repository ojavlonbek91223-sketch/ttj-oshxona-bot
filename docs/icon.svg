<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- 1-variant: qozon + "to'landi" belgisi -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24C"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8D2"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- bug' -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" opacity="0.9">
    <path d="M248 238 C 222 208, 272 186, 246 150"/>
    <path d="M320 226 C 294 194, 346 170, 320 130"/>
    <path d="M392 238 C 366 208, 416 186, 390 150"/>
  </g>
  <!-- tutqichlar -->
  <rect x="104" y="300" width="64" height="38" rx="19" fill="#FFF1E2"/>
  <rect x="472" y="300" width="64" height="38" rx="19" fill="#FFF1E2"/>
  <!-- qozon tanasi -->
  <path d="M148 296 H492 C 492 424, 420 500, 320 500 C 220 500, 148 424, 148 296 Z" fill="url(#pot)"/>
  <!-- qozon labi -->
  <rect x="128" y="270" width="384" height="42" rx="21" fill="#FFFFFF"/>
  <!-- to'landi belgisi -->
  <path d="M250 392 L 298 438 L 392 346" fill="none" stroke="#E8590C" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

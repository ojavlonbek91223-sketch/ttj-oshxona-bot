    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#1E88C7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#F26B1D"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- tarelka -->
  <circle cx="320" cy="330" r="168" fill="#FFFFFF"/>
  <circle cx="320" cy="330" r="128" fill="#E9F5FC"/>
  <!-- ustunlar -->
  <rect x="246" y="352" width="38" height="64" rx="10" fill="url(#bar)"/>
  <rect x="301" y="312" width="38" height="104" rx="10" fill="url(#bar)"/>
  <rect x="356" y="262" width="38" height="154" rx="10" fill="url(#bar)"/>
  <!-- vilka -->
  <g fill="#FFFFFF">
    <rect x="96" y="176" width="10" height="70" rx="5"/>
    <rect x="113" y="176" width="10" height="70" rx="5"/>
    <rect x="130" y="176" width="10" height="70" rx="5"/>
    <path d="M94 236 H142 V256 C142 270, 132 278, 128 280 V470 C128 480, 108 480, 108 470 V280 C104 278, 94 270, 94 256 Z"/>
  </g>
  <!-- qoshiq -->
  <g fill="#FFFFFF">
    <ellipse cx="528" cy="222" rx="30" ry="46"/>
    <rect x="518" y="258" width="20" height="214" rx="10"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- 2-variant: hisob daftari + cho'mich -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <g transform="rotate(-8 300 300)">
    <!-- daftar soyasi va o'zi -->
    <rect x="186" y="132" width="252" height="336" rx="28" fill="#0B4F4A" opacity="0.35" transform="translate(10 12)"/>
    <rect x="186" y="132" width="252" height="336" rx="28" fill="#FFFFFF"/>
    <!-- spiral -->
    <g fill="#0F766E">
      <circle cx="212" cy="182" r="11"/><circle cx="212" cy="242" r="11"/><circle cx="212" cy="302" r="11"/>
      <circle cx="212" cy="362" r="11"/><circle cx="212" cy="422" r="11"/>
    </g>
    <!-- qatorlar: to'langan / to'lanmagan -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M248 194 l14 14 l26 -28" stroke="#16A34A" stroke-width="12"/>
      <path d="M306 196 H404" stroke="#CBD5E1" stroke-width="12"/>
      <path d="M248 264 l14 14 l26 -28" stroke="#16A34A" stroke-width="12"/>
      <path d="M306 266 H404" stroke="#CBD5E1" stroke-width="12"/>
      <path d="M248 334 l14 14 l26 -28" stroke="#16A34A" stroke-width="12"/>
      <path d="M306 336 H404" stroke="#CBD5E1" stroke-width="12"/>
      <path d="M306 406 H380" stroke="#CBD5E1" stroke-width="12"/>
    </g>
    <circle cx="268" cy="404" r="15" fill="#F97316"/>
  </g>
  <!-- cho'mich -->
  <path d="M470 418 L 548 196" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <path d="M470 418 L 548 196" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  <circle cx="452" cy="470" r="66" fill="#FFFFFF"/>
  <circle cx="452" cy="470" r="54" fill="#F97316"/>
  <ellipse cx="452" cy="452" rx="38" ry="16" fill="#FFB27A"/>
</svg>
